<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PrimeWinRate</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span class="brand-ball">7</span><span data-i18n="app.name"></span></div>
    <div class="titlebar-status" id="job-status"></div>
    <div class="window-controls">
      <button data-win="minimize" data-i18n-title="window.minimize">&#x2013;</button>
      <button data-win="maximize" data-i18n-title="window.maximize">&#x25A1;</button>
      <button data-win="close" class="close" data-i18n-title="window.close">&#x2715;</button>
    </div>
  </header>
  <div class="shell">
    <nav class="sidebar" id="nav"></nav>
    <main id="view" class="view"></main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
