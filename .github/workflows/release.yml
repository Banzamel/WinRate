name: Build & release

# - every push to main and every pull request: tests;
# - a pushed version tag (v1.2.3) or a release published on GitHub: the Windows installer is built
#   and attached to the release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

jobs:
  test:
    if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}
      notes: ${{ github.event_name != 'release' }}
