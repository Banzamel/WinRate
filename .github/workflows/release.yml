name: Build & release

# - every push to main and every pull request: tests;
# - a version tag (v1.2.3, e.g. from `npm run release:patch` + `git push --follow-tags`)
#   or a release published on GitHub: tests, then the Windows installer is built and attached
#   to the release (created from the tag and CHANGELOG.md when it does not exist yet).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: windows-latest
    concurrency:
      group: release-${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tag is the version: a release made on GitHub with a tag that package.json does not
      # carry yet still builds with the tag's version.
      - name: Version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$CURRENT" ]; then npm version "$TAG" --no-git-tag-version --allow-same-version; fi
      - run: npm run fetch-history
      - run: node scripts/version.js notes release-notes.md
      - run: npx electron-builder --win nsis --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/PrimeWinRate-Setup-*.exe
            dist/PrimeWinRate-Setup-*.exe.blockmap
          body_path: ${{ github.event_name == 'release' && '' || 'release-notes.md' }}
