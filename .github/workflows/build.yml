name: Build installer

# Reusable: builds the Windows installer (Tauri, NSIS) for a version tag and attaches it to the
# GitHub release of that tag, together with:
#   - latest.json (with the updater signature in it), which installed apps (0.6+) read to update;
#   - latest.yml, which installed Electron versions (≤ 0.5.x) read, so they update into this one.
# Needs the repository secrets TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# if the key has one).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      notes:
        description: Write the release body from CHANGELOG.md (false keeps a body written on GitHub).
        type: boolean
        default: true

jobs:
  windows:
    runs-on: windows-latest
    concurrency:
      group: release-${{ inputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # The tag is the version: a release made on GitHub with a tag that package.json does not
      # carry yet still builds with the tag's version.
      - name: Version from tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"; TAG="${TAG#v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$CURRENT" ]; then npm version "$TAG" --no-git-tag-version --allow-same-version; fi
      - run: npm run fetch-history
      # Rust unit tests (need the built UI and the history resources, like the app build).
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: node scripts/version.cjs notes release-notes.md
      - name: Build (signed updater artifacts)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - run: node scripts/release-manifests.mjs src-tauri/target/release/bundle/nsis release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            release/WinRate-Setup-*.exe
            release/latest.json
            release/latest.yml
          body_path: ${{ inputs.notes && 'release-notes.md' || '' }}
